[project]
name = "gauntlet-sdk"
version = "0.1.0"
description = "OpenTelemetry-compatible SDK for instrumenting AI agents (3 lines, framework-agnostic)."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gauntlet*"]
