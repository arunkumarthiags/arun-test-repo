# Gauntlet — production nginx config.
#
# Responsibilities:
#   1. Terminate TLS (cert paths assume the certs/ volume is mounted into /etc/nginx/certs).
#   2. Reverse-proxy /api/* to the FastAPI service ("api" service in docker-compose.prod.yml).
#   3. Serve the built React SPA from /usr/share/nginx/html with proper history-API fallback.
#   4. Apply baseline hardening headers, gzip, and an API rate-limit zone.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile         on;
    tcp_nopush       on;
    tcp_nodelay      on;
    keepalive_timeout 65;
    server_tokens    off;
    client_max_body_size 16m;

    # ── gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── rate limiting (API only) ────────────────────────────────────────────
    # 100 r/s per client IP, with a burst of 50; nodelay so excess returns 503
    # instead of being queued at the proxy.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/s;
    limit_req_status 429;

    # ── upstream ────────────────────────────────────────────────────────────
    upstream gauntlet_api {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect (and ACME challenge passthrough) ──────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Allow certbot HTTP-01 challenges if mounted alongside.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── hardening headers ───────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "1; mode=block" always;

        # ── /api/* → FastAPI ────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;

            proxy_pass         http://gauntlet_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── /api/gate is sync and may take longer than typical reads ────────
        location = /api/gate {
            limit_req zone=api_zone burst=50 nodelay;

            proxy_pass         http://gauntlet_api/gate;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── SPA static assets + history-API fallback ───────────────────────
        root  /usr/share/nginx/html;
        index index.html;

        # Long-cache hashed assets emitted by Vite under /assets/.
        location /assets/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
