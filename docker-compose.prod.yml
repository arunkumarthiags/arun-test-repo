# docker-compose.prod.yml
#
# Production stack for Gauntlet:
#   • postgres + redis (with healthchecks)
#   • api  — gunicorn + uvicorn workers, built from the prod Dockerfile target
#   • worker — celery, same image
#   • frontend-build — one-shot that compiles the SPA and publishes /dist into a
#     shared named volume nginx serves from
#   • nginx — TLS termination, reverse proxy for /api/*, SPA static
#
# Secrets come exclusively from the host environment (see .env.example).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gauntlet}
      POSTGRES_USER: ${POSTGRES_USER:-gauntlet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gauntlet} -d ${POSTGRES_DB:-gauntlet}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./packages/gauntlet-api
      target: prod
    image: gauntlet-api:prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gauntlet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gauntlet}
      REDIS_URL: redis://redis:6379/0
      GAUNTLET_ENV: prod
      JUDGE_MODEL: ${JUDGE_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      DRIFT_WEBHOOK_URL: ${DRIFT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    build:
      context: ./packages/gauntlet-api
      target: prod
    image: gauntlet-api:prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gauntlet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gauntlet}
      REDIS_URL: redis://redis:6379/0
      GAUNTLET_ENV: prod
      JUDGE_MODEL: ${JUDGE_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command:
      - "celery"
      - "-A"
      - "gauntlet_api.workers.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=8"
      - "-Q"
      - "scoring,classify,adversarial,drift,gate"

  frontend-build:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: gauntlet-frontend:prod
    volumes:
      - frontend-build:/out
    # Default CMD copies /dist → /out (the shared volume) then exits.
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - frontend-build:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  frontend-build:
