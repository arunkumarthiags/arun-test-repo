version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wt-ros-postgres
    environment:
      POSTGRES_DB: wt_ros
      POSTGRES_USER: wt_ros
      POSTGRES_PASSWORD: local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wt_ros -d wt_ros"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wt-ros-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: wt-ros-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://wt_ros:local_dev@postgres:5432/wt_ros
      REDIS_URL: redis://redis:6379
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wt-ros-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/graphql
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules

  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: wt-ros-sync
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://wt_ros:local_dev@postgres:5432/wt_ros
      REDIS_URL: redis://redis:6379
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./sync:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
